<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎓 우리 학교 근처 맛집 추천</title>
    <style>
        /* Pretendard 폰트 불러오기 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        /* 버튼 그룹 */
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .main-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-search {
            background-color: #4A90E2;
            color: white;
        }

        .btn-search:hover {
            background-color: #357ABD;
            transform: translateY(-2px);
        }

        .btn-random {
            background-color: #FF6B6B;
            color: white;
        }

        .btn-random:hover {
            background-color: #EE5253;
            transform: translateY(-2px);
        }

        /* 카테고리 필터 버튼 */
        .filter-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: #f1f3f5;
            border: none;
            padding: 6px 14px;
            border-radius: 15px;
            font-size: 0.85rem;
            color: #495057;
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: #2c3e50;
            color: white;
        }

        /* 맛집 목록 */
        .restaurant-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* 맛집 카드 */
        .card {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            padding: 18px;
            text-align: left;
            position: relative;
            animation: fadeIn 0.3s ease-in-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info {
            flex: 1;
        }

        .category-badge {
            display: inline-block;
            background-color: #e3faf3;
            color: #0ca678;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #212529;
            margin-bottom: 4px;
        }

        .card-location {
            font-size: 0.88rem;
            color: #6c757d;
        }

        .map-link {
            display: inline-block;
            background-color: #fff;
            border: 1px solid #ced4da;
            color: #495057;
            padding: 8px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.2s;
        }

        .map-link:hover {
            background-color: #03cf5d;
            color: white;
            border-color: #03cf5d;
        }

        .empty-msg {
            color: #adb5bd;
            padding: 30px 0;
            font-size: 0.95rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎓 학교 근처 맛집 추천</h1>
            <p>오늘 점심/저녁 뭐 먹을지 고민될 때 눌러보세요!</p>
        </div>

        <!-- 메인 기능 버튼 -->
        <div class="btn-group">
            <button class="main-btn btn-search" onclick="loadRestaurants('전체')">🍽️ 맛집 찾아보기</button>
            <button class="main-btn btn-random" onclick="recommendRandom()">🎲 오늘 뭐 먹지? (랜덤)</button>
        </div>

        <!-- 카테고리 필터 (기본은 숨김) -->
        <div class="filter-group" id="filterGroup" style="display: none;">
            <button class="filter-btn active" onclick="filterCategory(this, '전체')">전체</button>
            <button class="filter-btn" onclick="filterCategory(this, '한식')">한식</button>
            <button class="filter-btn" onclick="filterCategory(this, '일식')">일식</button>
            <button class="filter-btn" onclick="filterCategory(this, '양식')">양식</button>
            <button class="filter-btn" onclick="filterCategory(this, '중식')">중식</button>
            <button class="filter-btn" onclick="filterCategory(this, '분식')">분식</button>
        </div>

        <!-- 맛집 리스트 표시 구역 -->
        <div class="restaurant-list" id="restaurantList">
            <div class="empty-msg">상단의 [맛집 찾아보기] 버튼을 눌러주세요!</div>
        </div>
    </div>

    <script>
        // 📌 학교 근처 맛집 데이터 (필요한 대로 자유롭게 추가/수정하세요)
        const restaurants = [
            { name: "할머니 손맛 제육", category: "한식", location: "학교 정문 도보 3분 (대학로 12)" },
            { name: "카츠마루 돈까스", category: "일식", location: "학교 후문 도보 5분 (학사길 45)" },
            { name: "파스타 아미고", category: "양식", location: "쪽문 도보 2분 (청춘로 8)" },
            { name: "황금룡 짜장면", category: "중식", location: "학교 정문 도보 6분 (대학로 30)" },
            { name: "신모듬 떡볶이", category: "분식", location: "후문 버스정류장 바로 앞" },
            { name: "엄마손 김치찌개", category: "한식", location: "학교 정문 도보 4분 (대학로 15)" },
            { name: "라멘마시타", category: "일식", location: "쪽문 도보 1분 (청춘로 3)" }
        ];

        let currentCategory = '전체';

        // 맛집 목록 불러오기 함수
        function loadRestaurants(category = '전체') {
            document.getElementById('filterGroup').style.display = 'flex';
            const listContainer = document.getElementById('restaurantList');
            listContainer.innerHTML = '';

            const filteredData = category === '전체' 
                ? restaurants 
                : restaurants.filter(r => r.category === category);

            if (filteredData.length === 0) {
                listContainer.innerHTML = '<div class="empty-msg">해당 카테고리의 맛집이 없습니다.</div>';
                return;
            }

            filteredData.forEach(resto => {
                const mapUrl = `https://map.naver.com/v5/search/${encodeURIComponent(resto.name)}`;
                const cardHtml = `
                    <div class="card">
                        <div class="card-info">
                            <span class="category-badge">${resto.category}</span>
                            <div class="card-title">${resto.name}</div>
                            <div class="card-location">📍 ${resto.location}</div>
                        </div>
                        <a href="${mapUrl}" target="_blank" class="map-link">지도 보기</a>
                    </div>
                `;
                listContainer.innerHTML += cardHtml;
            });
        }

        // 카테고리 필터링 함수
        function filterCategory(btnElement, category) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            currentCategory = category;
            loadRestaurants(category);
        }

        // 랜덤 추천 함수
        function recommendRandom() {
            document.getElementById('filterGroup').style.display = 'none';
            const listContainer = document.getElementById('restaurantList');
            
            // 랜덤으로 1개 선택
            const randomIndex = Math.floor(Math.random() * restaurants.length);
            const picked = restaurants[randomIndex];
            
            const mapUrl = `https://map.naver.com/v5/search/${encodeURIComponent(picked.name)}`;

            listContainer.innerHTML = `
                <div class="card" style="border: 2px solid #FF6B6B; background-color: #FFF5F5;">
                    <div class="card-info">
                        <span class="category-badge" style="background-color: #FFE3E3; color: #E03131;">🎉 오늘의 추천 맛집!</span>
                        <div class="card-title">${picked.name} (${picked.category})</div>
                        <div class="card-location">📍 ${picked.location}</div>
                    </div>
                    <a href="${mapUrl}" target="_blank" class="map-link">지도 보기</a>
                </div>
            `;
        }
    </script>
</body>
</html>
